<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; form-action 'none'; base-uri 'none'">
<title>Contraseña del respaldo</title><link rel="stylesheet" href="password.css"></head>
<body><main><h1>Protege tu respaldo</h1><p>Incluye expedientes, archivos y claves de cifrado. Usa una contraseña de al menos 12 caracteres. Necesitarás esta misma contraseña para restaurarlo.</p>
<form id="password-form"><label for="password">Contraseña del respaldo</label><input id="password" type="password" minlength="12" maxlength="1024" required autocomplete="off" autofocus><p id="error" role="alert"></p><div><button type="button" id="cancel">Cancelar</button><button type="submit">Continuar</button></div></form></main><script src="password.js"></script></body></html>
